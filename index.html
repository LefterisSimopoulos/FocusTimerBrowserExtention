<!DOCTYPE html>
<html>
<head>
    <style>
        body{
            background-color: #0e2c0e;
        }
        h1{
            color: #04AA6D
        }
        .button{
            color: #090000;
            padding: 15px 32px;
            margin-left: 10px;
        }
        .button1 {background-color: #04AA6D;}
        .btn-container {
            display: flex;
        }
        .start-button{
            display: flex;
            justify-content: center;
            margin-top: 24px;
        }

        .stop-button{
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .item {
            position: relative;
            float: left;
        }

        .item h2 {
            text-align:center;
            position: absolute;
            line-height: 125px;
            width: 100%;
        }

        svg {
        -webkit-transform: rotate(-90deg);
            transform: rotate(-90deg);
        }

        .circle_animation {
        stroke-dasharray: 440; /*pixel circumference of circle*/
        stroke-dashoffset: 440;
        transition: all 1s linear;
        }
        
    </style>
</head>
  <body>
    <h1>Focus Timer</h1>
    <div class="btn-container">
        <button class="button button1" id="btn15"> 15 mins </button>
        <button class="button button1" id="btn30"> 30 mins </button>
        <button class="button button1" id="btn60"> 60 mins </button>
    </div>

    <div class="item html">
    <h2>0:00</h2>
    <svg width="160" height="160" xmlns="http://www.w3.org/2000/svg">
     <g>
      <title>Layer 1</title>
      <circle id="circle" class="circle_animation" r="70" cy="81" cx="81" stroke-width="8" stroke="#6fdb6f" fill="none"/>
     </g>
    </svg>
    </div>
    
    <div class="start-button">
        <button class="button" id="start"> Start </button>
    </div>

    <div class="stop-button">
        <button class="button" id="stop"> Stop </button>
    </div>

    <script src="jquery-3.6.0.min.js"></script>
    <script src="main.js"></script>
  
</body>
</html>
